default:
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

lint:
  stage: lint
  script:
    - python -m ruff check .

format:
  stage: format
  script:
    - python -m ruff format --check .

type_check:
  stage: type_check
  script:
    - python -m mypy .

test:
  stage: test
  script:
    - python -m pytest

coverage:
  stage: coverage
  script:
    - python -m pytest --cov=. --cov-report=xml --cov-report=term