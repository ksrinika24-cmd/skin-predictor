stages:
  - lint
  - format
  - type_check
  - test
  - coverage

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON: "C:\\Program Files\\Python315\\python.exe"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

default:
  before_script:
    - '& "$env:PYTHON" --version'
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'

lint:
  stage: lint
  script:
    - '& "$env:PYTHON" -m ruff check .'

format:
  stage: format
  script:
    - '& "$env:PYTHON" -m ruff format --check .'

type_check:
  stage: type_check
  script:
    - '& "$env:PYTHON" -m mypy .'

test:
  stage: test
  script:
    - '& "$env:PYTHON" -m pytest'

coverage:
  stage: coverage
  script:
    - '& "$env:PYTHON" -m pytest --cov=. --cov-report=xml --cov-report=term'
  coverage: '/TOTAL.+?([0-9]{1,3}%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week